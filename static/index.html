<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book (static) — 3D Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f4f1ec; overflow: hidden; font-family: system-ui, sans-serif; }
    #viewer { width: 100vw; height: 100vh; display: block; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f4f1ec; color: #888; font-size: 1rem; z-index: 10; }
    #hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); color: #bbb; font-size: 0.75rem; pointer-events: none; }
    #controls {
      position: fixed; top: 80px; right: 20px;
      background: rgba(20, 20, 26, 0.88);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 18px 20px;
      color: #e0e0e0; font-size: 0.8rem;
      width: 220px;
      backdrop-filter: blur(12px);
      z-index: 20; display: none;
    }
    #controls h3 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #666; margin-bottom: 14px; font-weight: 500; }
    .dim-row { margin-bottom: 12px; }
    .dim-label { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .dim-label span:first-child { color: #aaa; }
    .dim-label span:last-child { color: #fff; font-weight: 600; min-width: 60px; text-align: right; }
    .dim-unit { color: #555; font-size: 0.7rem; margin-left: 2px; }
    input[type="range"] { -webkit-appearance: none; width: 100%; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #6c8fff; border-radius: 50%; cursor: pointer; box-shadow: 0 0 8px rgba(108,143,255,0.5); }
    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 14px 0; }
    #resetBtn { width: 100%; padding: 7px; background: rgba(108,143,255,0.15); border: 1px solid rgba(108,143,255,0.3); border-radius: 6px; color: #6c8fff; font-size: 0.75rem; cursor: pointer; }
    #resetBtn:hover { background: rgba(108,143,255,0.25); }
    #openBtn {
      width: 100%; padding: 9px;
      background: rgba(255, 160, 80, 0.18); border: 1px solid rgba(255, 160, 80, 0.35);
      border-radius: 6px; color: #ffb060; font-size: 0.78rem;
      cursor: pointer; font-weight: 500;
    }
    #openBtn:hover { background: rgba(255, 160, 80, 0.30); }
    #openBtn.open { background: rgba(80, 220, 130, 0.15); border-color: rgba(80, 220, 130, 0.35); color: #50dc82; }
    .anim-row { margin-top: 12px; }
    .anim-label { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .anim-label span:first-child { color: #aaa; font-size: 0.72rem; }
    .anim-label span:last-child { color: #fff; font-weight: 600; font-size: 0.72rem; }
    .rot-row { margin-bottom: 10px; }
    .rot-label { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .rot-label span:first-child { color: #aaa; font-size: 0.72rem; }
    .rot-label span:last-child { color: #fff; font-weight: 600; font-size: 0.72rem; }

    /* ── Cover Designer ── */
    #coverDesignerBtn {
      width: 100%; padding: 8px;
      background: rgba(200,100,255,0.15); border: 1px solid rgba(200,100,255,0.3);
      border-radius: 6px; color: #c864ff; font-size: 0.75rem;
      cursor: pointer; margin-top: 4px;
    }
    #coverDesignerBtn:hover { background: rgba(200,100,255,0.25); }

    #coverPanel {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 15, 22, 0.95);
      border: 1px solid rgba(200,100,255,0.25);
      border-radius: 14px; padding: 24px;
      color: #e0e0e0; font-size: 0.78rem;
      width: 480px; max-height: 90vh; overflow-y: auto;
      z-index: 100; display: none;
      backdrop-filter: blur(16px);
    }
    #coverPanel h2 { font-size: 0.85rem; font-weight: 600; color: #c864ff; margin-bottom: 16px; letter-spacing: 0.05em; }
    .cp-row { margin-bottom: 12px; }
    .cp-label { color: #888; font-size: 0.72rem; margin-bottom: 4px; display: block; }
    .cp-input { width: 100%; padding: 7px 10px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #e0e0e0; font-size: 0.78rem; outline: none; }
    .cp-input:focus { border-color: rgba(200,100,255,0.5); }
    .cp-row-inline { display: flex; gap: 8px; }
    .cp-row-inline .cp-row { flex: 1; }
    .cp-color-wrap { display: flex; align-items: center; gap: 8px; }
    .cp-color-wrap input[type="color"] { width: 36px; height: 32px; border: none; background: none; cursor: pointer; border-radius: 4px; padding: 0; }
    .cp-color-wrap span { color: #888; font-size: 0.72rem; }
    .cp-zone-btns { display: flex; gap: 6px; margin-bottom: 12px; }
    .cp-zone-btn {
      flex: 1; padding: 7px 4px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; color: #aaa; font-size: 0.72rem; cursor: pointer;
    }
    .cp-zone-btn.active { background: rgba(200,100,255,0.2); border-color: rgba(200,100,255,0.5); color: #c864ff; }
    #cpPreview { width: 100%; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 12px; display: block; image-rendering: pixelated; }
    .cp-actions { display: flex; gap: 8px; margin-top: 16px; }
    .cp-apply { flex: 1; padding: 9px; background: rgba(200,100,255,0.2); border: 1px solid rgba(200,100,255,0.4); border-radius: 6px; color: #c864ff; font-size: 0.78rem; cursor: pointer; }
    .cp-apply:hover { background: rgba(200,100,255,0.35); }
    .cp-close { padding: 9px 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #888; font-size: 0.78rem; cursor: pointer; }
    .cp-close:hover { background: rgba(255,255,255,0.1); color: #ccc; }
    .cp-font-size-row { display: flex; align-items: center; gap: 8px; }
    .cp-font-size-row input[type="range"] { flex: 1; }
    .cp-font-size-row span { color: #888; font-size: 0.72rem; min-width: 40px; }
  </style>
</head>
<body>

<div id="viewer"></div>
<div id="loading">Loading model…</div>
<div id="hint">Drag to rotate · Scroll to zoom · Right-drag to pan</div>

<div id="controls">
  <h3>Book Dimensions</h3>
  <div class="dim-row">
    <div class="dim-label"><span>Width</span><span><span id="wVal">14.0</span><span class="dim-unit">cm</span></span></div>
    <input type="range" id="wSlider" min="5" max="50" step="0.5" value="14">
  </div>
  <div class="dim-row">
    <div class="dim-label"><span>Height</span><span><span id="hVal">21.0</span><span class="dim-unit">cm</span></span></div>
    <input type="range" id="hSlider" min="5" max="40" step="0.5" value="21">
  </div>
  <div class="dim-row">
    <div class="dim-label"><span>Thickness</span><span><span id="tVal">2.0</span><span class="dim-unit">cm</span></span></div>
    <input type="range" id="tSlider" min="0.3" max="6" step="0.1" value="2">
  </div>
  <hr class="divider">
  <button id="openBtn">Open Book</button>
  <div class="anim-row">
    <div class="anim-label"><span>Open Amount</span><span><span id="openVal">0</span>%</span></div>
    <input type="range" id="openSlider" min="0" max="100" step="1" value="0">
  </div>
  <hr class="divider">
  <div class="rot-row">
    <div class="rot-label"><span>Flip X</span><span><span id="rotXVal">0</span>°</span></div>
    <input type="range" id="rotXSlider" min="0" max="360" step="1" value="0">
  </div>
  <div class="rot-row">
    <div class="rot-label"><span>Flip Y</span><span><span id="rotYVal">0</span>°</span></div>
    <input type="range" id="rotYSlider" min="-10000" max="10000" step="1" value="0">
  </div>
  <div class="rot-row">
    <div class="rot-label"><span>Flip Z</span><span><span id="rotZVal">0</span>°</span></div>
    <input type="range" id="rotZSlider" min="-10000" max="10000" step="1" value="0">
  </div>
  <hr class="divider">
  <button id="resetBtn">Reset</button>
  <div style="display:flex;align-items:center;gap:4px;margin-top:8px">
    <select id="posSelect" style="flex:1;padding:5px 8px;border-radius:8px;border:1px solid #555;background:#222;color:#ccc;cursor:pointer">
      <option value="">— Load position —</option>
    </select>
    <button class="btn anim-btn" id="savePosBtn">Save</button>
    <button class="btn anim-btn" id="delPosBtn" style="background:#4a2020">🗑</button>
  </div>
  <hr class="divider">
  <button id="coverDesignerBtn">Cover Designer</button>
</div>

<!-- Cover Designer Panel -->
<div id="coverPanel">
  <h2>Cover Designer</h2>

  <!-- Texture Preview -->
  <canvas id="cpPreview" width="400" height="600"></canvas>

  <!-- Cover Part Selector -->
  <div class="cp-zone-btns">
    <button class="cp-zone-btn active" data-zone="front">Front</button>
    <button class="cp-zone-btn" data-zone="spine">Spine</button>
    <button class="cp-zone-btn" data-zone="back">Back</button>
  </div>

  <!-- Text Fields -->
  <div class="cp-row">
    <label class="cp-label">Title</label>
    <input type="text" class="cp-input" id="cpTitle" placeholder="Book Title" maxlength="60">
  </div>
  <div class="cp-row">
    <label class="cp-label">Subtitle</label>
    <input type="text" class="cp-input" id="cpSubtitle" placeholder="Optional subtitle" maxlength="80">
  </div>
  <div class="cp-row">
    <label class="cp-label">Author</label>
    <input type="text" class="cp-input" id="cpAuthor" placeholder="Author Name" maxlength="40">
  </div>

  <!-- Font Size -->
  <div class="cp-row">
    <label class="cp-label">Text Size</label>
    <div class="cp-font-size-row">
      <input type="range" id="cpFontSize" min="12" max="120" step="1" value="48">
      <span id="cpFontSizeVal">48px</span>
    </div>
  </div>

  <!-- Colors -->
  <div class="cp-row-inline">
    <div class="cp-row">
      <label class="cp-label">Cover Color</label>
      <div class="cp-color-wrap">
        <input type="color" id="cpCoverColor" value="#8B4513">
        <span id="cpCoverColorHex">#8B4513</span>
      </div>
    </div>
    <div class="cp-row">
      <label class="cp-label">Text Color</label>
      <div class="cp-color-wrap">
        <input type="color" id="cpTextColor" value="#FFFFFF">
        <span id="cpTextColorHex">#FFFFFF</span>
      </div>
    </div>
  </div>

  <!-- Paper Color -->
  <div class="cp-row">
    <label class="cp-label">Paper Color</label>
    <div class="cp-color-wrap">
      <input type="color" id="cpPaperColor" value="#F5F0E8">
      <span id="cpPaperColorHex">#F5F0E8</span>
    </div>
  </div>

  <!-- Texture Color (tint whole texture) -->
  <div class="cp-row">
    <label class="cp-label">Texture Tint (applies color overlay on top of texture image)</label>
    <div class="cp-color-wrap">
      <input type="color" id="cpTintColor" value="#FFFFFF">
      <span id="cpTintColorHex">#FFFFFF (none)</span>
    </div>
  </div>

  <div class="cp-actions">
    <button class="cp-apply" id="cpApply">Apply to Book</button>
    <button class="cp-close" id="cpClose">Close</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ── Biblio light theme ─────────────────────────────────────────────────────
const THEME = {
  background: 0xf4f1ec,
  fog: { color: 0xf4f1ec, near: 800, far: 2200 },
  ambient: { top: 0xfffdf5, bottom: 0xe8e4dc, intensity: 0.5 },
  keyLight: { color: 0xfff8e8, intensity: 1.5, pos: [4, 8, 5] },
  fillLight: { color: 0xf0f4f8, intensity: 0.35, pos: [-5, 3, 2] },
  rimLight: { color: 0xffffff, intensity: 0.25, pos: [0, 2, -4] },
  exposure: 1.15,
};

const container = document.getElementById('viewer');
const loading = document.getElementById('loading');
const controls = document.getElementById('controls');

const sliders = {
  w: document.getElementById('wSlider'),
  h: document.getElementById('hSlider'),
  t: document.getElementById('tSlider'),
};
const vals = {
  w: document.getElementById('wVal'),
  h: document.getElementById('hVal'),
  t: document.getElementById('tVal'),
};
const openSlider = document.getElementById('openSlider');
const openVal = document.getElementById('openVal');
const openBtn = document.getElementById('openBtn');
const rotXSlider = document.getElementById('rotXSlider');
const rotYSlider = document.getElementById('rotYSlider');
const rotZSlider = document.getElementById('rotZSlider');
const rotXVal = document.getElementById('rotXVal');
const rotYVal = document.getElementById('rotYVal');
const rotZVal = document.getElementById('rotZVal');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMappingExposure = THEME.exposure;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = makeGradientTexture(THEME.background, 0xebe6dd);
scene.fog = new THREE.Fog(THEME.fog.color, THEME.fog.near, THEME.fog.far);

function makeGradientTexture(top, bottom) {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  const hex = (n) => '#' + n.toString(16).padStart(6, '0');
  g.addColorStop(0, hex(top));
  g.addColorStop(0.55, hex(top));
  g.addColorStop(1, hex(bottom));
  ctx.fillStyle = g; ctx.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 20, 60);

// ── Controls ─────────────────────────────────────────────────────────────────
// OrbitControls: left-drag would rotate the camera — but we use custom drag
// to rotate the book in place (Y = horizontal drag, Z = vertical drag).
// Right-drag pans, scroll zooms.
const orbitControls = new OrbitControls(camera, renderer.domElement);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.06;
orbitControls.minDistance = 5;
orbitControls.maxDistance = 500;
orbitControls.target.set(0, 0, 0);
orbitControls.enableRotate = false; // book rotation is handled manually below

// ── Book drag-to-rotate (Y and Z only) ─────────────────────────────────────
let isDragging = false, lastX = 0, lastY = 0;

renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return; // left click only
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;

  // Horizontal drag → Z rotation
  rotZSlider.value = parseInt(rotZSlider.value) + dx * 0.5;
  // Vertical drag → Y rotation (inverted)
  rotYSlider.value = parseInt(rotYSlider.value) - dy * 0.5;

  rotYVal.textContent = Math.round(rotYSlider.value);
  rotZVal.textContent = Math.round(rotZSlider.value);
  applyRotation();
});

window.addEventListener('mouseup', () => { isDragging = false; });
renderer.domElement.addEventListener('mouseleave', () => { isDragging = false; });

scene.add(new THREE.HemisphereLight(THEME.ambient.top, THEME.ambient.bottom, THEME.ambient.intensity));
const key = new THREE.DirectionalLight(THEME.keyLight.color, THEME.keyLight.intensity);
key.position.set(...THEME.keyLight.pos); scene.add(key);
const fill = new THREE.DirectionalLight(THEME.fillLight.color, THEME.fillLight.intensity);
fill.position.set(...THEME.fillLight.pos); scene.add(fill);
const rim = new THREE.DirectionalLight(THEME.rimLight.color, THEME.rimLight.intensity);
rim.position.set(...THEME.rimLight.pos); scene.add(rim);

const DEFAULT_W = 14, DEFAULT_H = 21, DEFAULT_T = 2;

let baseSize = { x: 1, y: 1, z: 1 };
let bookGroup = null;
let mixer = null;
let animAction = null;
let animDuration = 0;
let openAmount = 0;
let isOpen = false;
let animating = false;

function applySize(wCm, hCm, tCm) {
  if (!bookGroup) return;
  // The model has nested scales (armature ×100 inside model ×0.17). Non-uniform
  // scaling shears the hierarchy — use uniform scaling driven by the height
  // slider, which is the most "real" book dimension. Width/thickness are
  // displayed but don't independently rescale (the model's authored aspect
  // ratio is preserved).
  const s = hCm / baseSize.y;
  bookGroup.scale.set(s, s, s);
}

function sitOnGround() {
  if (!bookGroup) return;
  bookGroup.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(bookGroup);
  if (isFinite(box.min.y)) bookGroup.position.y -= box.min.y;
}

function setOpenAmount(t) {
  if (!animAction) return;
  openAmount = Math.max(0, Math.min(1, t));
  animAction.time = openAmount * animDuration;
  mixer.update(0);
  openSlider.value = Math.round(openAmount * 100);
  openVal.textContent = Math.round(openAmount * 100);
  openBtn.textContent = isOpen ? 'Close Book' : 'Open Book';
  openBtn.classList.toggle('open', openAmount > 0.05);
}

function toggleOpen() {
  if (animating || !animAction) return;
  isOpen = !isOpen;
  const target = isOpen ? 1 : 0;
  const start = openAmount;
  const dur = 1.2;
  let elapsed = 0;
  animating = true;
  let last = performance.now();
  function step(now) {
    const dt = (now - last) / 1000;
    last = now;
    elapsed += dt;
    let pct = Math.min(elapsed / dur, 1);
    pct = 1 - Math.pow(1 - pct, 3);
    setOpenAmount(start + (target - start) * pct);
    if (pct < 1) requestAnimationFrame(step);
    else animating = false;
  }
  requestAnimationFrame(step);
}

openBtn.addEventListener('click', toggleOpen);
openSlider.addEventListener('input', () => setOpenAmount(parseInt(openSlider.value) / 100));

function applyRotation() {
  if (!bookGroup) return;
  // Base orientation: book stands upright (rotation.x = -PI/2)
  // Slider rotations are additive on top of that.
  bookGroup.rotation.x = -Math.PI / 2 + (parseInt(rotXSlider.value) / 180) * Math.PI;
  bookGroup.rotation.y = (parseInt(rotYSlider.value) / 180) * Math.PI;
  bookGroup.rotation.z = (parseInt(rotZSlider.value) / 180) * Math.PI;
}

function onRotSlider() {
  rotXVal.textContent = rotXSlider.value;
  rotYVal.textContent = rotYSlider.value;
  rotZVal.textContent = rotZSlider.value;
  applyRotation();
}

rotXSlider.addEventListener('input', onRotSlider);
rotYSlider.addEventListener('input', onRotSlider);
rotZSlider.addEventListener('input', onRotSlider);

// Two-level hierarchy:
//   bookGroup (world-space container)
//     └── gltf.scene
const loader = new GLTFLoader();
loader.load('./scene.gltf', (gltf) => {
  bookGroup = new THREE.Group();
  scene.add(bookGroup);
  bookGroup.add(gltf.scene);
  gltf.scene.traverse((o) => {
    if (o.isMesh || o.isSkinnedMesh) {
      o.frustumCulled = false;
      // Cover designer: capture book mesh and pages mesh references
      const n = o.name.toLowerCase();
      if (!bookMesh && n.includes('book') && !n.includes('pages')) {
        bookMesh = o;
        bookMaterial = o.material;
      }
      if (!pagesMesh && n.includes('page')) {
        pagesMesh = o;
        pagesMaterial = o.material;
      }
    }
  });

  // Stand the book upright: model's Z axis → world Y (up).
  // applyRotation() below will set the full rotation (base + slider offsets).

  // Measure intrinsic size at scale 1 so cm sliders map to scene units.
  const measureBox = new THREE.Box3().setFromObject(gltf.scene);
  const measured = measureBox.getSize(new THREE.Vector3());
  baseSize = { x: measured.x, y: measured.y, z: measured.z };

  // Center the book at world origin so OrbitControls.target = (0,0,0) is correct.
  const box = new THREE.Box3().setFromObject(bookGroup);
  const center = box.getCenter(new THREE.Vector3());
  bookGroup.position.sub(center);

  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(bookGroup);
    const clip = gltf.animations[0];
    animAction = mixer.clipAction(clip);
    animDuration = clip.duration;
    animAction.play();
    animAction.paused = true;
    animAction.time = 0;
  }

  applySize(DEFAULT_W, DEFAULT_H, DEFAULT_T);
  applyRotation(); // set initial orientation (upright + any slider defaults)

  // Camera positioned to frame the book nicely — OrbitControls orbits around (0,0,0).
  const maxDim = Math.max(baseSize.x, baseSize.y, baseSize.z);
  const dist = maxDim / (2 * Math.tan((camera.fov * Math.PI / 180) / 2)) * 2.2;
  camera.position.set(dist * 0.5, dist * 0.35, dist);
  camera.lookAt(0, 0, 0);
  orbitControls.target.set(0, 0, 0);
  orbitControls.update();

  controls.style.display = 'block';
  loading.style.display = 'none';
  applyDefaultPosition();
}, undefined, (err) => {
  loading.textContent = 'Error: ' + err.message;
});

function onSlider() {
  const w = parseFloat(sliders.w.value);
  const h = parseFloat(sliders.h.value);
  const t = parseFloat(sliders.t.value);
  vals.w.textContent = w.toFixed(1);
  vals.h.textContent = h.toFixed(1);
  vals.t.textContent = t.toFixed(1);
  applySize(w, h, t);
}

sliders.w.addEventListener('input', onSlider);
sliders.h.addEventListener('input', onSlider);
sliders.t.addEventListener('input', onSlider);

document.getElementById('resetBtn').addEventListener('click', () => {
  sliders.w.value = DEFAULT_W;
  sliders.h.value = DEFAULT_H;
  sliders.t.value = DEFAULT_T;
  onSlider();
  setOpenAmount(0);
  rotXSlider.value = 0; rotYSlider.value = 0; rotZSlider.value = 0;
  rotXVal.textContent = '0'; rotYVal.textContent = '0'; rotZVal.textContent = '0';
  applyRotation();
  isOpen = false;
  animating = false;
});

// ── Position Save / Load ───────────────────────────────────────────
const posSelect  = document.getElementById('posSelect');
const savePosBtn = document.getElementById('savePosBtn');
const delPosBtn  = document.getElementById('delPosBtn');

function getCameraState() {
  return {
    px: camera.position.x, py: camera.position.y, pz: camera.position.z,
    tx: orbitControls.target.x, ty: orbitControls.target.y, tz: orbitControls.target.z,
    fov: camera.fov,
  };
}

function applyCameraState(s) {
  camera.position.set(s.px, s.py, s.pz);
  orbitControls.target.set(s.tx, s.ty, s.tz);
  camera.fov = s.fov;
  camera.updateProjectionMatrix();
  orbitControls.update();
}

function loadPositions() {
  const stored = JSON.parse(localStorage.getItem('bookViewerPositions') || '[]');
  posSelect.innerHTML = '<option value="">— Load position —</option>';
  stored.forEach((p, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = p.name;
    posSelect.appendChild(opt);
  });
}
loadPositions();

function applyDefaultPosition() {
  const stored = JSON.parse(localStorage.getItem('bookViewerPositions') || '[]');
  const front = stored.find(p => p.name.toLowerCase() === 'front');
  if (!front) return;
  rotXSlider.value = front.rx;
  rotYSlider.value = front.ry;
  rotZSlider.value = front.rz;
  rotXVal.textContent = front.rx;
  rotYVal.textContent = front.ry;
  rotZVal.textContent = front.rz;
  applyRotation();
  applyCameraState(front);
}

posSelect.addEventListener('change', () => {
  const idx = posSelect.value;
  if (idx === '') return;
  const stored = JSON.parse(localStorage.getItem('bookViewerPositions') || '[]');
  const p = stored[idx];
  if (!p) return;
  rotXSlider.value = p.rx;
  rotYSlider.value = p.ry;
  rotZSlider.value = p.rz;
  rotXVal.textContent = p.rx;
  rotYVal.textContent = p.ry;
  rotZVal.textContent = p.rz;
  applyRotation();
  applyCameraState(p);
  posSelect.value = '';
});

savePosBtn.addEventListener('click', () => {
  const name = prompt('Position name:');
  if (!name || !name.trim()) return;
  const stored = JSON.parse(localStorage.getItem('bookViewerPositions') || '[]');
  stored.push({
    name: name.trim(),
    rx: parseInt(rotXSlider.value),
    ry: parseInt(rotYSlider.value),
    rz: parseInt(rotZSlider.value),
    ...getCameraState(),
  });
  localStorage.setItem('bookViewerPositions', JSON.stringify(stored));
  loadPositions();
});

delPosBtn.addEventListener('click', () => {
  const idx = posSelect.value;
  if (idx === '') { alert('Pick a position to delete first.'); return; }
  const stored = JSON.parse(localStorage.getItem('bookViewerPositions') || '[]');
  stored.splice(idx, 1);
  localStorage.setItem('bookViewerPositions', JSON.stringify(stored));
  loadPositions();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  if (mixer) mixer.update(0); // animation time managed manually
  orbitControls.update();
  renderer.render(scene, camera);
}
animate();

// ═══════════════════════════════════════════════════════════════════════════════
// ── Cover Designer ───────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════

// Cover zone UV bounds (from glTF analysis):
//   Front: u[0.01–0.68], v[0.11–1.0]
//   Spine: u[0.68–0.73], v[0.11–1.0]
//   Back:  u[0.73–0.99], v[0.11–1.0]
const ZONE_UV = {
  front: { uMin: 0.01, uMax: 0.68, vMin: 0.11, vMax: 1.00 },
  spine: { uMin: 0.68, uMax: 0.73, vMin: 0.11, vMax: 1.00 },
  back:  { uMin: 0.73, uMax: 0.99, vMin: 0.11, vMax: 1.00 },
};
const TEX_W = 2048, TEX_H = 2048;

// State
let coverDesignerActiveZone = 'front';
let texCanvas = null;       // 2048×2048 offscreen canvas
let texCtx = null;
let bookMesh = null;
let pagesMesh = null;
let bookMaterial = null;
let pagesMaterial = null;
let coverDesignerReady = false;

// Zone canvas-pixel bounds
function zonePixels(zone) {
  const z = ZONE_UV[zone];
  return {
    x: Math.round(z.uMin * TEX_W),
    y: Math.round((1 - z.vMax) * TEX_H),
    w: Math.round((z.uMax - z.uMin) * TEX_W),
    h: Math.round((z.vMax - z.vMin) * TEX_H),
  };
}

// Load the original baseColor texture as a canvas
function loadOriginalTexture() {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      texCanvas = document.createElement('canvas');
      texCanvas.width = TEX_W;
      texCanvas.height = TEX_H;
      texCtx = texCanvas.getContext('2d');
      texCtx.drawImage(img, 0, 0);
      resolve();
    };
    img.onerror = () => {
      // Fallback: blank canvas
      texCanvas = document.createElement('canvas');
      texCanvas.width = TEX_W;
      texCanvas.height = TEX_H;
      texCtx = texCanvas.getContext('2d');
      resolve();
    };
    img.src = './textures/book_baseColor.png';
  });
}

// Clear a zone to a solid color on the texture canvas
function clearZone(zone, hexColor) {
  const px = zonePixels(zone);
  texCtx.fillStyle = hexColor;
  texCtx.fillRect(px.x, px.y, px.w, px.h);
}

// Wrap long text onto lines
function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for (const word of words) {
    const test = current ? `${current} ${word}` : word;
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines;
}

// Draw text into a zone centered vertically
function drawTextInZone(zone, title, subtitle, author, fontSize, textColor) {
  if (!texCtx || (!title && !subtitle && !author)) return;
  const px = zonePixels(zone);
  const cx = px.x + px.w / 2; // center x of zone
  const zoneW = px.w;

  texCtx.save();
  texCtx.textAlign = 'center';
  texCtx.textBaseline = 'middle';

  const effectiveFontSize = Math.min(fontSize, px.h * 0.18);
  const lineHeight = effectiveFontSize * 1.35;
  const hasTitle = !!title.trim();
  const hasSub   = !!subtitle.trim();
  const hasAuth  = !!author.trim();
  const totalLines = (hasTitle ? 1 : 0) + (hasSub ? 1 : 0) + (hasAuth ? 1 : 0);
  if (totalLines === 0) { texCtx.restore(); return; }

  // Starting y: center the block vertically in the zone
  const totalH = totalLines * lineHeight;
  let y = px.y + px.h / 2 - totalH / 2 + lineHeight / 2;

  if (hasTitle) {
    texCtx.font = `bold ${effectiveFontSize}px Georgia, serif`;
    texCtx.fillStyle = textColor;
    const lines = wrapText(texCtx, title.trim(), zoneW * 0.9);
    lines.forEach((l, i) => {
      texCtx.fillText(l, cx, y + i * lineHeight);
    });
    y += lines.length * lineHeight;
  }

  if (hasSub) {
    texCtx.font = `${effectiveFontSize * 0.65}px Georgia, serif`;
    texCtx.fillStyle = textColor;
    texCtx.globalAlpha = 0.85;
    const lines = wrapText(texCtx, subtitle.trim(), zoneW * 0.9);
    lines.forEach((l, i) => {
      texCtx.fillText(l, cx, y + i * lineHeight);
    });
    texCtx.globalAlpha = 1.0;
    y += lines.length * lineHeight;
  }

  if (hasAuth) {
    texCtx.font = `italic ${effectiveFontSize * 0.6}px Georgia, serif`;
    texCtx.fillStyle = textColor;
    texCtx.globalAlpha = 0.8;
    const lines = wrapText(texCtx, author.trim(), zoneW * 0.9);
    lines.forEach((l, i) => {
      texCtx.fillText(l, cx, y + i * lineHeight);
    });
    texCtx.globalAlpha = 1.0;
  }

  texCtx.restore();
}

// Apply tint overlay on entire texture
function applyTint(hexColor) {
  if (!hexColor || hexColor === '#FFFFFF') return;
  texCtx.save();
  texCtx.globalCompositeOperation = 'multiply';
  texCtx.fillStyle = hexColor;
  texCtx.fillRect(0, 0, TEX_W, TEX_H);
  texCtx.restore();
}

// Render the preview thumbnail in the panel
function renderPreview() {
  const preview = document.getElementById('cpPreview');
  if (!preview || !texCanvas) return;
  const pctx = preview.getContext('2d');
  const zone = ZONE_UV[coverDesignerActiveZone];
  // Show the full texture with a highlight border around the active zone
  pctx.clearRect(0, 0, preview.width, preview.height);

  // Draw scaled full texture
  pctx.drawImage(texCanvas, 0, 0, preview.width, preview.height);

  // Draw highlight box around active zone
  const sx = zone.uMin * preview.width;
  const sy = (1 - zone.vMax) * preview.height;
  const sw = (zone.uMax - zone.uMin) * preview.width;
  const sh = (zone.vMax - zone.vMin) * preview.height;
  pctx.strokeStyle = '#c864ff';
  pctx.lineWidth = 2;
  pctx.strokeRect(sx, sy, sw, sh);

  // Label
  pctx.fillStyle = '#c864ff';
  pctx.font = 'bold 11px system-ui';
  pctx.textAlign = 'left';
  pctx.fillText(coverDesignerActiveZone.toUpperCase() + ' ZONE', sx + 4, sy + 14);
}

// Upload the texture canvas to the Three.js material
function applyTextureToBook() {
  if (!bookMaterial || !texCanvas) return;
  const newTex = new THREE.CanvasTexture(texCanvas);
  newTex.colorSpace = THREE.SRGBColorSpace;
  newTex.needsUpdate = true;
  if (bookMaterial.map) bookMaterial.map.dispose();
  bookMaterial.map = newTex;
  bookMaterial.needsUpdate = true;
}

// Apply paper color to the pages mesh
function applyPaperColor(hexColor) {
  if (!pagesMaterial) return;
  const col = new THREE.Color(hexColor);
  pagesMaterial.color.set(col);
  pagesMaterial.needsUpdate = true;
}

// ── UI wiring ────────────────────────────────────────────────────────────────

document.getElementById('coverDesignerBtn').addEventListener('click', async () => {
  const panel = document.getElementById('coverPanel');
  panel.style.display = 'block';
  if (!coverDesignerReady) {
    await loadOriginalTexture();
    coverDesignerReady = true;
    renderPreview();
  } else {
    renderPreview();
  }
});

document.getElementById('cpClose').addEventListener('click', () => {
  document.getElementById('coverPanel').style.display = 'none';
});

// Zone buttons
document.querySelectorAll('.cp-zone-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cp-zone-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    coverDesignerActiveZone = btn.dataset.zone;
    renderPreview();
  });
});

// Live preview as user types / changes settings (no apply needed)
function liveUpdate() {
  if (!coverDesignerReady) return;

  const title    = document.getElementById('cpTitle').value;
  const subtitle = document.getElementById('cpSubtitle').value;
  const author   = document.getElementById('cpAuthor').value;
  const fontSize = parseInt(document.getElementById('cpFontSize').value);
  const textColor = document.getElementById('cpTextColor').value;
  const coverColor = document.getElementById('cpCoverColor').value;
  const tintColor  = document.getElementById('cpTintColor').value;

  // Reload original texture first
  loadOriginalTexture().then(() => {
    // Apply tint on top of original
    if (tintColor !== '#FFFFFF') {
      texCtx.save();
      texCtx.globalCompositeOperation = 'multiply';
      texCtx.fillStyle = tintColor;
      texCtx.fillRect(0, 0, TEX_W, TEX_H);
      texCtx.restore();
    }
    // Draw on all zones
    const zones = ['front', 'spine', 'back'];
    zones.forEach((z) => {
      clearZone(z, coverColor);
    });
    drawTextInZone(coverDesignerActiveZone, title, subtitle, author, fontSize, textColor);
    renderPreview();
  });
}

// Wire live update events
['cpTitle', 'cpSubtitle', 'cpAuthor'].forEach((id) => {
  document.getElementById(id).addEventListener('input', liveUpdate);
});
document.getElementById('cpFontSize').addEventListener('input', () => {
  document.getElementById('cpFontSizeVal').textContent = document.getElementById('cpFontSize').value + 'px';
  liveUpdate();
});
document.getElementById('cpTextColor').addEventListener('input', () => {
  document.getElementById('cpTextColorHex').textContent = document.getElementById('cpTextColor').value;
  liveUpdate();
});
document.getElementById('cpCoverColor').addEventListener('input', () => {
  document.getElementById('cpCoverColorHex').textContent = document.getElementById('cpCoverColor').value;
  liveUpdate();
});
document.getElementById('cpTintColor').addEventListener('input', () => {
  const v = document.getElementById('cpTintColor').value;
  document.getElementById('cpTintColorHex').textContent = v === '#FFFFFF' ? '#FFFFFF (none)' : v;
  liveUpdate();
});
document.getElementById('cpPaperColor').addEventListener('input', () => {
  document.getElementById('cpPaperColorHex').textContent = document.getElementById('cpPaperColor').value;
  applyPaperColor(document.getElementById('cpPaperColor').value);
});

// Apply button: actually upload texture to the 3D book
document.getElementById('cpApply').addEventListener('click', () => {
  if (!coverDesignerReady) return;
  applyTextureToBook();
  document.getElementById('coverPanel').style.display = 'none';
});


</script>
