<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book (static) — 3D Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f4f1ec; overflow: hidden; font-family: system-ui, sans-serif; }
    #viewer { width: 100vw; height: 100vh; display: block; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f4f1ec; color: #888; font-size: 1rem; z-index: 10; }
    #hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); color: #bbb; font-size: 0.75rem; pointer-events: none; }
    #controls {
      position: fixed; top: 80px; right: 20px;
      background: rgba(20, 20, 26, 0.88);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 18px 20px;
      color: #e0e0e0; font-size: 0.8rem;
      width: 220px;
      backdrop-filter: blur(12px);
      z-index: 20; display: none;
    }
    #controls h3 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #666; margin-bottom: 14px; font-weight: 500; }
    .dim-row { margin-bottom: 12px; }
    .dim-label { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .dim-label span:first-child { color: #aaa; }
    .dim-label span:last-child { color: #fff; font-weight: 600; min-width: 60px; text-align: right; }
    .dim-unit { color: #555; font-size: 0.7rem; margin-left: 2px; }
    input[type="range"] { -webkit-appearance: none; width: 100%; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #6c8fff; border-radius: 50%; cursor: pointer; box-shadow: 0 0 8px rgba(108,143,255,0.5); }
    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 14px 0; }
    #resetBtn { width: 100%; padding: 7px; background: rgba(108,143,255,0.15); border: 1px solid rgba(108,143,255,0.3); border-radius: 6px; color: #6c8fff; font-size: 0.75rem; cursor: pointer; }
    #resetBtn:hover { background: rgba(108,143,255,0.25); }
    #openBtn {
      width: 100%; padding: 9px;
      background: rgba(255, 160, 80, 0.18); border: 1px solid rgba(255, 160, 80, 0.35);
      border-radius: 6px; color: #ffb060; font-size: 0.78rem;
      cursor: pointer; font-weight: 500;
    }
    #openBtn:hover { background: rgba(255, 160, 80, 0.30); }
    #openBtn.open { background: rgba(80, 220, 130, 0.15); border-color: rgba(80, 220, 130, 0.35); color: #50dc82; }
    .anim-row { margin-top: 12px; }
    .anim-label { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .anim-label span:first-child { color: #aaa; font-size: 0.72rem; }
    .anim-label span:last-child { color: #fff; font-weight: 600; font-size: 0.72rem; }
    .rot-row { margin-bottom: 10px; }
    .rot-label { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .rot-label span:first-child { color: #aaa; font-size: 0.72rem; }
    .rot-label span:last-child { color: #fff; font-weight: 600; font-size: 0.72rem; }

    /* ── Cover Designer v2 ── */
    #coverDesignerBtn {
      width: 100%; padding: 8px;
      background: rgba(200,100,255,0.15); border: 1px solid rgba(200,100,255,0.3);
      border-radius: 6px; color: #c864ff; font-size: 0.75rem;
      cursor: pointer; margin-top: 4px;
    }
    #coverDesignerBtn:hover { background: rgba(200,100,255,0.25); }

    #coverPanel {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 15, 22, 0.96);
      border: 1px solid rgba(200,100,255,0.25);
      border-radius: 14px; padding: 22px;
      color: #e0e0e0; font-size: 0.78rem;
      width: 540px; max-height: 92vh; overflow-y: auto;
      z-index: 100; display: none;
      backdrop-filter: blur(16px);
    }
    #coverPanel h2 { font-size: 0.85rem; font-weight: 600; color: #c864ff; margin-bottom: 14px; letter-spacing: 0.05em; }

    .cp-tabs { display: flex; gap: 2px; margin-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .cp-tab { flex: 1; padding: 8px 6px; background: none; border: none; color: #777; font-size: 0.74rem; cursor: pointer; border-bottom: 2px solid transparent; font-family: inherit; }
    .cp-tab.active { color: #c864ff; border-bottom-color: #c864ff; }
    .cp-tab:hover { color: #ccc; }
    .cp-page { display: none; }
    .cp-page.active { display: block; }

    .cp-row { margin-bottom: 10px; }
    .cp-label { color: #888; font-size: 0.7rem; margin-bottom: 4px; display: block; }
    .cp-input, .cp-textarea { width: 100%; padding: 7px 10px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #e0e0e0; font-size: 0.78rem; outline: none; font-family: inherit; }
    .cp-textarea { min-height: 60px; resize: vertical; }
    .cp-input:focus, .cp-textarea:focus { border-color: rgba(200,100,255,0.5); }
    .cp-row-inline { display: flex; gap: 8px; }
    .cp-row-inline .cp-row { flex: 1; }
    .cp-color-wrap { display: flex; align-items: center; gap: 8px; }
    .cp-color-wrap input[type="color"] { width: 36px; height: 32px; border: none; background: none; cursor: pointer; border-radius: 4px; padding: 0; }
    .cp-color-wrap span { color: #888; font-size: 0.7rem; font-family: monospace; }
    .cp-range-row { display: flex; align-items: center; gap: 8px; }
    .cp-range-row input[type="range"] { flex: 1; }
    .cp-range-row span { color: #888; font-size: 0.7rem; min-width: 38px; text-align: right; }
    .cp-checkbox { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 0.74rem; cursor: pointer; }
    .cp-checkbox input { cursor: pointer; }

    #cpPreviewWrap { position: relative; margin-bottom: 12px; }
    #cpPreview { width: 100%; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); display: block; image-rendering: auto; background: #222; }
    #cpPreviewLabel { position: absolute; top: 6px; left: 8px; font-size: 0.65rem; color: rgba(255,255,255,0.5); letter-spacing: 0.05em; }

    .cp-actions { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
    .cp-actions button { padding: 8px 12px; border-radius: 6px; font-size: 0.74rem; cursor: pointer; font-family: inherit; }
    .cp-apply { flex: 1; min-width: 100px; background: rgba(200,100,255,0.2); border: 1px solid rgba(200,100,255,0.4); color: #c864ff; }
    .cp-apply:hover { background: rgba(200,100,255,0.35); }
    .cp-secondary { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #aaa; }
    .cp-secondary:hover { background: rgba(255,255,255,0.1); color: #ddd; }

    .cp-saves { display: flex; align-items: center; gap: 4px; margin-top: 10px; }
    .cp-saves select { flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #333; background: #1a1a22; color: #ccc; cursor: pointer; font-family: inherit; font-size: 0.74rem; }
    .cp-saves button { padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: #aaa; cursor: pointer; font-size: 0.7rem; }
  </style>
</head>
<body>

<div id="viewer"></div>
<div id="loading">Loading model…</div>
<div id="hint">Drag to rotate · Scroll to zoom · Right-drag to pan</div>

<div id="controls">
  <h3>Book Dimensions</h3>
  <div class="dim-row">
    <div class="dim-label"><span>Width</span><span><span id="wVal">14.0</span><span class="dim-unit">cm</span></span></div>
    <input type="range" id="wSlider" min="5" max="50" step="0.5" value="14">
  </div>
  <div class="dim-row">
    <div class="dim-label"><span>Height</span><span><span id="hVal">21.0</span><span class="dim-unit">cm</span></span></div>
    <input type="range" id="hSlider" min="5" max="40" step="0.5" value="21">
  </div>
  <div class="dim-row">
    <div class="dim-label"><span>Thickness</span><span><span id="tVal">2.0</span><span class="dim-unit">cm</span></span></div>
    <input type="range" id="tSlider" min="0.3" max="6" step="0.1" value="2">
  </div>
  <hr class="divider">
  <button id="openBtn">Open Book</button>
  <div class="anim-row">
    <div class="anim-label"><span>Open Amount</span><span><span id="openVal">0</span>%</span></div>
    <input type="range" id="openSlider" min="0" max="100" step="1" value="0">
  </div>
  <hr class="divider">
  <div class="rot-row">
    <div class="rot-label"><span>Flip X</span><span><span id="rotXVal">0</span>°</span></div>
    <input type="range" id="rotXSlider" min="0" max="360" step="1" value="0">
  </div>
  <div class="rot-row">
    <div class="rot-label"><span>Flip Y</span><span><span id="rotYVal">0</span>°</span></div>
    <input type="range" id="rotYSlider" min="-10000" max="10000" step="1" value="0">
  </div>
  <div class="rot-row">
    <div class="rot-label"><span>Flip Z</span><span><span id="rotZVal">0</span>°</span></div>
    <input type="range" id="rotZSlider" min="-10000" max="10000" step="1" value="0">
  </div>
  <hr class="divider">
  <button id="resetBtn">Reset</button>
  <div style="display:flex;align-items:center;gap:4px;margin-top:8px">
    <select id="posSelect" style="flex:1;padding:5px 8px;border-radius:8px;border:1px solid #555;background:#222;color:#ccc;cursor:pointer">
      <option value="">— Load position —</option>
    </select>
    <button class="btn anim-btn" id="savePosBtn">Save</button>
    <button class="btn anim-btn" id="delPosBtn" style="background:#4a2020">🗑</button>
  </div>
  <hr class="divider">
  <button id="coverDesignerBtn">Cover Designer</button>
</div>

<!-- Cover Designer Panel v2 -->
<div id="coverPanel">
  <h2>Cover Designer</h2>

  <div id="cpPreviewWrap">
    <canvas id="cpPreview" width="540" height="540"></canvas>
    <div id="cpPreviewLabel">UV LAYOUT · BACK | SPINE | FRONT</div>
  </div>

  <label class="cp-checkbox" style="margin-bottom:10px;">
  <!-- INNER COVER -->
  <div class="cp-page" data-page="inner">
    <div class="cp-row">
      <label class="cp-label">Inner Cover Color</label>
      <div class="cp-color-wrap"><input type="color" id="cpInnerColor" value="#8B1A1A"><span id="cpInnerColorHex">#8B1A1A</span></div>
    </div>
    <p style="font-size:0.72rem;color:#888;margin-top:8px;">Fills the inner liner visible when the book is open. Auto-syncs to front cover color by default.</p>
    <label style="display:flex;align-items:center;gap:8px;font-size:0.8rem;color:#ccc;margin-top:10px;">
      <input type="checkbox" id="cpInnerSync" checked> Sync to front cover color
    </label>
  </div>

    <input type="checkbox" id="cpShowZones"> Calibration mode (paint regions in legend colors)
  </label>

  <div class="cp-tabs">
    <button class="cp-tab active" data-tab="front">Front</button>
    <button class="cp-tab" data-tab="spine">Spine</button>
    <button class="cp-tab" data-tab="back">Back</button>
    <button class="cp-tab" data-tab="paper">Paper</button>
    <button class="cp-tab" data-tab="inner">Inner</button>
  </div>

  <!-- FRONT -->
  <div class="cp-page active" data-page="front">
    <div class="cp-row-inline">
      <div class="cp-row">
        <label class="cp-label">Cover Color</label>
        <div class="cp-color-wrap"><input type="color" id="cpFrontColor" value="#8B1A1A"><span id="cpFrontColorHex">#8B1A1A</span></div>
      </div>
      <div class="cp-row">
        <label class="cp-label">Text Color</label>
        <div class="cp-color-wrap"><input type="color" id="cpFrontTextColor" value="#F2D27A"><span id="cpFrontTextColorHex">#F2D27A</span></div>
      </div>
    </div>
    <div class="cp-row"><label class="cp-label">Title</label><input type="text" class="cp-input" id="cpFrontTitle" value="The Great Gatsby" maxlength="80"></div>
    <div class="cp-row"><label class="cp-label">Subtitle</label><input type="text" class="cp-input" id="cpFrontSubtitle" placeholder="Optional subtitle" maxlength="100"></div>
    <div class="cp-row"><label class="cp-label">Author</label><input type="text" class="cp-input" id="cpFrontAuthor" value="F. Scott Fitzgerald" maxlength="60"></div>
    <div class="cp-row">
      <label class="cp-label">Title Size</label>
      <div class="cp-range-row"><input type="range" id="cpFrontFontSize" min="40" max="180" step="2" value="110"><span id="cpFrontFontSizeVal">110</span></div>
    </div>
    <div class="cp-row">
      <label class="cp-label">Font</label>
      <select class="cp-input" id="cpFrontFont">
        <option value="Georgia, serif">Georgia (serif)</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="'Playfair Display', Georgia, serif">Playfair (serif display)</option>
        <option value="'Helvetica Neue', Arial, sans-serif">Helvetica</option>
        <option value="'Courier New', monospace">Courier (mono)</option>
      </select>
    </div>
    <label class="cp-checkbox"><input type="checkbox" id="cpFrontFrame" checked> Show ornamental frame</label>
    <div class="cp-row" style="margin-top:8px;">
      <label class="cp-label">Cover Image (optional)</label>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="file" class="cp-input" id="cpFrontImage" accept="image/*" style="flex:1;">
        <span id="cpFrontImageName" style="font-size:0.68rem;color:#888;white-space:nowrap;overflow:hidden;max-width:120px;text-overflow:ellipsis;"></span>
      </div>
    </div>
  </div>

  <!-- SPINE -->
  <div class="cp-page" data-page="spine">
    <div class="cp-row-inline">
      <div class="cp-row">
        <label class="cp-label">Spine Color</label>
        <div class="cp-color-wrap"><input type="color" id="cpSpineColor" value="#6B1414"><span id="cpSpineColorHex">#6B1414</span></div>
      </div>
      <div class="cp-row">
        <label class="cp-label">Text Color</label>
        <div class="cp-color-wrap"><input type="color" id="cpSpineTextColor" value="#F2D27A"><span id="cpSpineTextColorHex">#F2D27A</span></div>
      </div>
    </div>
    <div class="cp-row"><label class="cp-label">Spine Title</label><input type="text" class="cp-input" id="cpSpineTitle" value="GATSBY" maxlength="40"></div>
    <div class="cp-row"><label class="cp-label">Spine Author</label><input type="text" class="cp-input" id="cpSpineAuthor" value="FITZGERALD" maxlength="40"></div>
    <div class="cp-row">
      <label class="cp-label">Text Size</label>
      <div class="cp-range-row"><input type="range" id="cpSpineFontSize" min="20" max="80" step="1" value="42"><span id="cpSpineFontSizeVal">42</span></div>
    </div>
    <label class="cp-checkbox"><input type="checkbox" id="cpSpineBands" checked> Accent bands (top/bottom)</label>
  </div>

  <!-- BACK -->
  <div class="cp-page" data-page="back">
    <div class="cp-row-inline">
      <div class="cp-row">
        <label class="cp-label">Back Color</label>
        <div class="cp-color-wrap"><input type="color" id="cpBackColor" value="#8B1A1A"><span id="cpBackColorHex">#8B1A1A</span></div>
      </div>
      <div class="cp-row">
        <label class="cp-label">Text Color</label>
        <div class="cp-color-wrap"><input type="color" id="cpBackTextColor" value="#F2EFE6"><span id="cpBackTextColorHex">#F2EFE6</span></div>
      </div>
    </div>
    <div class="cp-row">
      <label class="cp-label">Blurb / Description</label>
      <textarea class="cp-textarea" id="cpBackBlurb" maxlength="800" placeholder="Back-cover blurb…">In my younger and more vulnerable years my father gave me some advice that I've been turning over in my mind ever since. "Whenever you feel like criticizing anyone," he told me, "just remember that all the people in this world haven't had the advantages that you've had."</textarea>
    </div>
    <div class="cp-row">
      <label class="cp-label">Blurb Size</label>
      <div class="cp-range-row"><input type="range" id="cpBackFontSize" min="18" max="60" step="1" value="32"><span id="cpBackFontSizeVal">32</span></div>
    </div>
    <label class="cp-checkbox"><input type="checkbox" id="cpBackBarcode"> Show barcode placeholder</label>
  </div>

  <!-- PAPER -->
  <div class="cp-page" data-page="paper">
    <div class="cp-row">
      <label class="cp-label">Page Color</label>
      <div class="cp-color-wrap"><input type="color" id="cpPaperColor" value="#F5F0E8"><span id="cpPaperColorHex">#F5F0E8</span></div>
    </div>
    <label class="cp-checkbox"><input type="checkbox" id="cpPaperGrain" checked> Paper grain (subtle fiber texture)</label>
    <div class="cp-row" style="margin-top:10px;">
      <label class="cp-label">Inside Content (visible at page-block edges and through opening)</label>
      <textarea class="cp-textarea" id="cpPaperContent" maxlength="2000" placeholder="Sample text from inside the book — first page, opening line, or any excerpt…">It was the best of times, it was the worst of times, it was the age of wisdom, it was the age of foolishness, it was the epoch of belief, it was the epoch of incredulity…</textarea>
    </div>
    <div class="cp-row">
      <label class="cp-label">Content Size</label>
      <div class="cp-range-row"><input type="range" id="cpPaperFontSize" min="14" max="48" step="1" value="22"><span id="cpPaperFontSizeVal">22</span></div>
    </div>
  </div>

  <div class="cp-saves">
    <select id="cpDesignSelect"><option value="">— Load design —</option></select>
    <button id="cpSaveBtn">Save</button>
    <button id="cpDelBtn" style="background:#4a2020;color:#f88;">🗑</button>
  </div>

  <div class="cp-actions">
    <button class="cp-apply" id="cpApply">Apply to Book</button>
    <button class="cp-secondary" id="cpDownload">Download PNG</button>
    <button class="cp-secondary" id="cpDownloadJSON">Download JSON</button>
    <button class="cp-secondary" id="cpLoadEpub">Load .epub…</button>
    <input type="file" id="cpEpubInput" accept=".epub" style="display:none">
    <button class="cp-secondary" id="cpClose">Close</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ── Biblio light theme ─────────────────────────────────────────────────────
const THEME = {
  background: 0xf4f1ec,
  fog: { color: 0xf4f1ec, near: 800, far: 2200 },
  ambient: { top: 0xfffdf5, bottom: 0xe8e4dc, intensity: 0.5 },
  keyLight: { color: 0xfff8e8, intensity: 1.5, pos: [4, 8, 5] },
  fillLight: { color: 0xf0f4f8, intensity: 0.35, pos: [-5, 3, 2] },
  rimLight: { color: 0xffffff, intensity: 0.25, pos: [0, 2, -4] },
  exposure: 1.15,
};

const container = document.getElementById('viewer');
const loading = document.getElementById('loading');
const controls = document.getElementById('controls');

const sliders = {
  w: document.getElementById('wSlider'),
  h: document.getElementById('hSlider'),
  t: document.getElementById('tSlider'),
};
const vals = {
  w: document.getElementById('wVal'),
  h: document.getElementById('hVal'),
  t: document.getElementById('tVal'),
};
const openSlider = document.getElementById('openSlider');
const openVal = document.getElementById('openVal');
const openBtn = document.getElementById('openBtn');
const rotXSlider = document.getElementById('rotXSlider');
const rotYSlider = document.getElementById('rotYSlider');
const rotZSlider = document.getElementById('rotZSlider');
const rotXVal = document.getElementById('rotXVal');
const rotYVal = document.getElementById('rotYVal');
const rotZVal = document.getElementById('rotZVal');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMappingExposure = THEME.exposure;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = makeGradientTexture(THEME.background, 0xebe6dd);
scene.fog = new THREE.Fog(THEME.fog.color, THEME.fog.near, THEME.fog.far);

function makeGradientTexture(top, bottom) {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  const hex = (n) => '#' + n.toString(16).padStart(6, '0');
  g.addColorStop(0, hex(top));
  g.addColorStop(0.55, hex(top));
  g.addColorStop(1, hex(bottom));
  ctx.fillStyle = g; ctx.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 20, 60);

// ── Controls ─────────────────────────────────────────────────────────────────
// OrbitControls: left-drag would rotate the camera — but we use custom drag
// to rotate the book in place (Y = horizontal drag, Z = vertical drag).
// Right-drag pans, scroll zooms.
const orbitControls = new OrbitControls(camera, renderer.domElement);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.06;
orbitControls.minDistance = 5;
orbitControls.maxDistance = 500;
orbitControls.target.set(0, 0, 0);
orbitControls.enableRotate = false; // book rotation is handled manually below

// ── Book drag-to-rotate (Y and Z only) ─────────────────────────────────────
let isDragging = false, lastX = 0, lastY = 0;

renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return; // left click only
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;

  // Horizontal drag → Z rotation
  rotZSlider.value = parseInt(rotZSlider.value) + dx * 0.5;
  // Vertical drag → Y rotation (inverted)
  rotYSlider.value = parseInt(rotYSlider.value) - dy * 0.5;

  rotYVal.textContent = Math.round(rotYSlider.value);
  rotZVal.textContent = Math.round(rotZSlider.value);
  applyRotation();
});

const DEFAULT_W = 14, DEFAULT_H = 21, DEFAULT_T = 2;

let baseSize = { x: 1, y: 1, z: 1 };
let bookGroup = null;
let mixer = null;
let animAction = null;
let animDuration = 0;
let openAmount = 0;
let isOpen = false;
let animating = false;

function applySize(wCm, hCm, tCm) {
  if (!bookGroup) return;
  // refScale is the uniform scale that makes the model look like a standard book
  // at the default dimensions (same reference the old uniform-scale code used).
  // Per-axis: multiply refScale by the ratio of the requested cm to the default cm.
  // At defaults (DEFAULT_W/H/T) all three axes equal refScale → same as old uniform
  // scale, so the book looks identical to the previously working state.
  // Each slider then changes only its own axis proportionally from that baseline:
  // doubling W doubles the visual width, doubling H doubles the visual height, etc.
  const refScale = DEFAULT_H / baseSize.y;
  const sx = refScale * (wCm / DEFAULT_W);   // width  → model X axis
  const sy = refScale * (tCm / DEFAULT_T);   // thickness → model Y axis (depth after rotation)
  const sz = refScale * (hCm / DEFAULT_H);   // height → model Z axis (up after rotation)
  bookGroup.scale.set(sx, sy, sz);
}

function sitOnGround() {
  if (!bookGroup) return;
  bookGroup.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(bookGroup);
  if (isFinite(box.min.y)) bookGroup.position.y -= box.min.y;
}

function setOpenAmount(t) {
  if (!animAction) return;
  openAmount = Math.max(0, Math.min(1, t));
  animAction.time = openAmount * animDuration;
  mixer.update(0);
  openSlider.value = Math.round(openAmount * 100);
  openVal.textContent = Math.round(openAmount * 100);
  openBtn.textContent = isOpen ? 'Close Book' : 'Open Book';
  openBtn.classList.toggle('open', openAmount > 0.05);
}

function toggleOpen() {
  if (animating || !animAction) return;
  isOpen = !isOpen;
  const target = isOpen ? 1 : 0;
  const start = openAmount;
  const dur = 1.2;
  let elapsed = 0;
  animating = true;
  let last = performance.now();
  function step(now) {
    const dt = (now - last) / 1000;
    last = now;
    elapsed += dt;
    let pct = Math.min(elapsed / dur, 1);
    pct = 1 - Math.pow(1 - pct, 3);
    setOpenAmount(start + (target - start) * pct);
    if (pct < 1) requestAnimationFrame(step);
    else animating = false;
  }
  requestAnimationFrame(step);
}

openBtn.addEventListener('click', toggleOpen);
openSlider.addEventListener('input', () => setOpenAmount(parseInt(openSlider.value) / 100));

function applyRotation() {
  if (!bookGroup) return;
  // Base orientation: book stands upright (rotation.x = -PI/2)
  // Slider rotations are additive on top of that.
  bookGroup.rotation.x = -Math.PI / 2 + (parseInt(rotXSlider.value) / 180) * Math.PI;
  bookGroup.rotation.y = (parseInt(rotYSlider.value) / 180) * Math.PI;
  bookGroup.rotation.z = (parseInt(rotZSlider.value) / 180) * Math.PI;
}

function onRotSlider() {
  rotXVal.textContent = rotXSlider.value;
  rotYVal.textContent = rotYSlider.value;
  rotZVal.textContent = rotZSlider.value;
  applyRotation();
}

// Two-level hierarchy:
//   bookGroup (world-space container)
//     └── gltf.scene
const loader = new GLTFLoader();
loader.load('./scene.gltf', (gltf) => {
  bookGroup = new THREE.Group();
  scene.add(bookGroup);
  bookGroup.add(gltf.scene);
  // glTF node names are anonymous (Object_9 etc.) and ALL three meshes are
  // SkinnedMesh in this model. Distinguish the cover (448 verts, rigged with
  // back/spine/front bones) from the pages by vertex count: cover has the
  // most verts on the rigged "book" mesh, pages are plain rectangles.
  const allMeshes = [];
  gltf.scene.traverse(o => { if (o.isMesh || o.isSkinnedMesh) { o.frustumCulled = false; allMeshes.push(o); } });
  // First skinned mesh with > 200 verts is the cover; the rest are pages.
  const allPagesMeshes = [];
  for (const o of allMeshes) {
    if (!bookMesh && o.geometry.attributes.position.count >= 200) {
      bookMesh = o;
      bookMaterial = o.material;
      console.log('[CoverDesigner] captured cover mesh:', o.name, 'verts:', o.geometry.attributes.position.count);
    } else {
      allPagesMeshes.push(o);
      console.log('[CoverDesigner] captured pages mesh:', o.name, 'verts:', o.geometry.attributes.position.count);
    }
  }
  pagesMesh = allPagesMeshes[0] || null;
  // (debug) expose for browser-console inspection during development
  window.__bookMesh = bookMesh; window.__bookMat = bookMaterial;
  window.__camera = camera; window.__orbit = orbitControls; window.__bookGroup = bookGroup;
  // Pages share the cover material in this glTF — leave them as-is so book
  // content painted into REGIONS.contentUpper/contentLower lands on the
  // actual page surfaces.
  pagesMaterial = bookMaterial;
  // Strip the cover material's normal and metallic-roughness maps. They were
  // baked from the ORIGINAL artwork (red leather + gold ornament bumps), so
  // they keep imprinting the old design over our designer's flat fill. Leave
  // the basic PBR sliders untouched; we re-add a leather feel later.
  if (bookMaterial) {
    if (bookMaterial.normalMap) { bookMaterial.normalMap.dispose(); bookMaterial.normalMap = null; }
    if (bookMaterial.metalnessMap) { bookMaterial.metalnessMap.dispose(); bookMaterial.metalnessMap = null; }
    if (bookMaterial.roughnessMap) { bookMaterial.roughnessMap.dispose(); bookMaterial.roughnessMap = null; }
    bookMaterial.roughness = 0.7;
    bookMaterial.metalness = 0;
    bookMaterial.needsUpdate = true;
  }

  // Stand the book upright: model's Z axis → world Y (up).
  // applyRotation() below will set the full rotation (base + slider offsets).

  // Measure intrinsic size at scale 1 so cm sliders map to scene units.
  const measureBox = new THREE.Box3().setFromObject(gltf.scene);
  const measured = measureBox.getSize(new THREE.Vector3());
  baseSize = { x: measured.x, y: measured.y, z: measured.z };

  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(bookGroup);
    const clip = gltf.animations[0];
    animAction = mixer.clipAction(clip);
    animDuration = clip.duration;
    animAction.play();
    animAction.paused = true;
    animAction.time = 0;
  }

  applySize(DEFAULT_W, DEFAULT_H, DEFAULT_T);
  applyRotation(); // set initial orientation (upright + any slider defaults)
  // bookGroup.position stays at (0,0,0). The SkinnedMesh at time=0 (closed-book
  // pose) has its rendered centroid very close to world origin already — empirically
  // confirmed by placing camera at z=8 and seeing the book approximately centred.
  // Using Box3.setFromObject() here gives the REST-POSE bounding box, which is
  // wrong for a skinned mesh (vertices are spread in the bind pose) and would
  // push the actual rendered book completely out of the camera's view.

  // Camera distance: the rendered (skinned) book at refScale is much smaller
  // than the rest-pose bbox used by baseSize. Calibrate to actual rendered size:
  // at refScale the book face is ~1.5 world units tall, so dist≈5 fills ~33% of
  // the viewport (fov=50). Scale by max(w,h)/DEFAULT_H for larger/smaller books.
  const maxCm = Math.max(DEFAULT_W, DEFAULT_H);
  const dist = 5 * (maxCm / DEFAULT_H);
  camera.lookAt(0, 0, 0);
  orbitControls.target.set(0, 0, 0);
  orbitControls.update();

  controls.style.display = 'block';
  loading.style.display = 'none';
  applyDefaultPosition();
}, undefined, (err) => {
  loading.textContent = 'Error: ' + err.message;
});

// ═══════════════════════════════════════════════════════════════════════════════
// ── Cover Designer v2 — per-zone (front / spine / back) ─────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
//
// The cover mesh is rigged with bones back_00 / spine_01 / front_02. Skin weights
// cleanly partition the 448 vertices into three non-overlapping UV zones (verified
// by rasterizing UV triangles and labelling them by dominant bone). Each zone has
// its own pixel-mask in the 2048×2048 baseColor texture, so we can paint them
// independently without disturbing the pages-mesh UV region (x>1401).
//
// Pipeline:
//   1. UV partition (once at load): classify each vertex by dominant skin weight
//      → back/spine/front, then rasterize triangles into per-zone mask canvases.
//   2. Texture compositor: build a fresh 2048² canvas zone-by-zone, clipping to
//      each zone mask, then upload as a CanvasTexture.
//   3. Pages mesh material is independent (color + optional edge-tint).

const TEX_W = 2048, TEX_H = 2048;

// State
let texCanvas = null, texCtx = null;       // main 2048² compositor
let bookMesh = null, pagesMesh = null;
let bookMaterial = null, pagesMaterial = null;
let coverDesignerReady = false;
let frontImageBitmap = null;               // user-uploaded cover image (runtime)
let frontImageData = null;                 // base64 data URL (persisted in design)

// ── REGIONS table (hand-verified pixel rectangles on the 2048² texture) ─────
//
// Pixel coordinates extracted from the user's hand-marked overlay. Edit any
// rect that's off and the painters/preview update automatically — these are
// the single source of truth. The calibration overlay (Show region overlay)
// renders each rect as a unique solid color matching the user's legend so
// off-by-N pixel mistakes show up immediately on the rendered book.
//
// `flipX`/`flipY` capture the GPU's UV mirror per region; verified per-region
// during calibration by reading which corner letter (TL/TR/BL/BR) lands where.
const REGIONS = {
  // Cover trio tiles edge-to-edge across the bottom-half of the texture.
  // Layout (canvas-X order):  FRONT | SPINE | BACK  — verified empirically.
  // All three start at y0=1224 (top of the visible face; the liner area above
  // is hidden when the book is closed). Back width == front width (620px).
  front:        { x0:    0, y0: 1224, x1:  620, y1: 2048, color: '#5A8CFF', label: 'FRONT',     flipX: true,  flipY: false, visY0: 1224 },
  spine:        { x0:  620, y0: 1224, x1:  800, y1: 2048, color: '#FFC81E', label: 'SPINE',     flipX: true,  flipY: false, visY0: 1224 },
  back:         { x0:  800, y0: 1224, x1: 1420, y1: 2048, color: '#3CFA82', label: 'BACK',      flipX: true,  flipY: false, visY0: 1224 },
  // Paper region — extends full designer width including over content-U.
  paperEdges:   { x0:    0, y0:  150, x1: 1990, y1:  500, color: '#BBBBBB', label: 'PAPER',     flipX: false, flipY: false },
  // Page content — right column (x=[1430,1990]), split equally from paper bottom
  // (y=500) to texture bottom (y=2048). Mirror + upside-down on the rendered face.
  contentUpper: { x0: 1430, y0:  500, x1: 2048, y1: 1274, color: '#FF8800', label: 'CONTENT-U', flipX: true,  flipY: true },
  contentLower: { x0: 1430, y0: 1274, x1: 2048, y1: 2048, color: '#9933FF', label: 'CONTENT-L', flipX: true,  flipY: true },
};

// ── Text helpers ────────────────────────────────────────────────────────────
function wrapText(ctx, text, maxWidth) {
  const lines = [];
  for (const para of text.split('\n')) {
    const words = para.split(' ');
    let cur = '';
    for (const w of words) {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width > maxWidth && cur) { lines.push(cur); cur = w; }
      else cur = t;
    }
    lines.push(cur);
  }
  return lines;
}

// ── Per-zone painters ───────────────────────────────────────────────────────
// Each painter draws WITHIN that zone's mask via destination-in clipping.
// We achieve this by drawing into a per-zone scratch canvas, then compositing
// with the mask, then blitting onto the main texCanvas.

// Each zone's UV island is rendered onto the book with a 180° rotation
// relative to canvas orientation (empirically verified: text painted right-side
// up on canvas appears upside-down on the visible cover face). Compensate by
// rotating the painter context 180° around the zone's centroid before drawing.
// Paint into a zone's mask. The cover's UV mapping renders canvas pixels
// with X mirrored on the visible face (verified by the BL corner test). The
// outer face samples a SUB-RECTANGLE of the bone-classified bbox (not the
// whole bbox — the rest is inner liner / hidden). Each painter passes that
// sub-rectangle as `panel`, and we apply a horizontal mirror around the
// PANEL center so the painter can author text in natural orientation —
// the un-mirroring happens automatically when the GPU samples.
// Paint into a region's pixel rect with optional X / Y mirror compensation.
// Painters work in natural reading orientation (top-left = visible top-left
// of the rendered face); the GPU's UV flip is undone by the per-region flags.
function paintRegion(regionKey, paintFn) {
  const r = REGIONS[regionKey];
  if (!r) return;
  texCtx.save();
  // Hard clip so painters can't bleed into neighbouring regions.
  texCtx.beginPath();
  texCtx.rect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
  texCtx.clip();
  // Flip around the region centre so canvas x/y still grow in their natural
  // direction inside the painter — only the GPU sampling sees the mirror.
  const cx = (r.x0 + r.x1) / 2, cy = (r.y0 + r.y1) / 2;
  if (r.flipX || r.flipY) {
    texCtx.translate(cx, cy);
    texCtx.scale(r.flipX ? -1 : 1, r.flipY ? -1 : 1);
    texCtx.translate(-cx, -cy);
  }
  paintFn(texCtx, r);
  texCtx.restore();
}

// ── Painters — each draws into one REGIONS rect, using natural top-left coords ─
function paintFront(d) {
  paintRegion('front', (ctx, r) => {
    const w = r.x1 - r.x0, h = r.y1 - r.y0;
    // Base color fills the WHOLE bbox (incl. inner-cover area above visY0) so
    // there's no black border anywhere. Images and text only target the
    // visible face area below.
    ctx.fillStyle = d.front.color;
    ctx.fillRect(r.x0, r.y0, w, h);

    const visY0 = r.visY0 != null ? r.visY0 : r.y0;
    const visH  = r.y1 - visY0;
    const visAspect = w / visH;

    if (frontImageBitmap) {
      // Map the entire source image to the visible face rect (visY0→y1).
      // Drawing from r.y0 puts the top of the image in the hidden inner-liner
      // area (y0→visY0), which crops the header off the rendered face.
      ctx.drawImage(frontImageBitmap, 0, 0, frontImageBitmap.width, frontImageBitmap.height, r.x0, visY0, w, visH);
      return; // image fills the visible front cover, no frame/text
    }

    if (d.front.frame) {
      const inset = Math.min(w, visH) * 0.04;
      ctx.strokeStyle = d.front.textColor;
      ctx.lineWidth = Math.max(3, Math.min(w, visH) * 0.008);
      ctx.strokeRect(r.x0 + inset, visY0 + inset, w - inset*2, visH - inset*2);
      ctx.lineWidth *= 0.4;
      ctx.strokeRect(r.x0 + inset + 10, visY0 + inset + 10, w - inset*2 - 20, visH - inset*2 - 20);
    }

    ctx.fillStyle = d.front.textColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const cx = r.x0 + w / 2;
    const titleSize  = d.front.fontSize * (Math.min(w, visH) / 700);
    const subSize    = titleSize * 0.55;
    const authorSize = titleSize * 0.5;
    const maxW = w * 0.85;

    const t = d.front.title.trim(), s = d.front.subtitle.trim(), a = d.front.author.trim();
    ctx.font = `bold ${titleSize}px ${d.front.font}`;
    const titleLines  = t ? wrapText(ctx, t, maxW) : [];
    ctx.font = `${subSize}px ${d.front.font}`;
    const subLines    = s ? wrapText(ctx, s, maxW) : [];
    ctx.font = `italic ${authorSize}px ${d.front.font}`;
    const authorLines = a ? wrapText(ctx, a, maxW) : [];

    const lineGap = titleSize * 1.15;
    const subGap  = subSize  * 1.2;
    const authGap = authorSize * 1.2;
    const blockH  = titleLines.length * lineGap
                  + (subLines.length    ? subLines.length    * subGap  + lineGap*0.4 : 0)
                  + (authorLines.length ? authorLines.length * authGap + lineGap*0.6 : 0);
    let y = visY0 + visH * 0.5 - blockH / 2;
    ctx.font = `bold ${titleSize}px ${d.front.font}`;
    titleLines.forEach(l => { ctx.fillText(l, cx, y + lineGap/2); y += lineGap; });
    if (subLines.length) {
      y += lineGap * 0.4;
      ctx.font = `${subSize}px ${d.front.font}`;
      ctx.globalAlpha = 0.85;
      subLines.forEach(l => { ctx.fillText(l, cx, y + subGap/2); y += subGap; });
      ctx.globalAlpha = 1;
    }
    if (authorLines.length) {
      y += lineGap * 0.6;
      ctx.font = `italic ${authorSize}px ${d.front.font}`;
      ctx.globalAlpha = 0.85;
      authorLines.forEach(l => { ctx.fillText(l, cx, y + authGap/2); y += authGap; });
      ctx.globalAlpha = 1;
    }
  });
}

function paintSpine(d) {
  paintRegion('spine', (ctx, r) => {
    const w = r.x1 - r.x0, h = r.y1 - r.y0;
    ctx.fillStyle = d.spine.color;
    ctx.fillRect(r.x0, r.y0, w, h);

    const visY0 = r.visY0 != null ? r.visY0 : r.y0;
    const visH  = r.y1 - visY0;

    if (d.spine.bands) {
      ctx.fillStyle = d.spine.textColor;
      const bandH = visH * 0.018;
      ctx.fillRect(r.x0, visY0 + visH * 0.06, w, bandH);
      ctx.fillRect(r.x0, r.y1 - visH * 0.06 - bandH, w, bandH);
    }

    // Vertical title (top-to-bottom on the rendered spine = rotate -90°)
    ctx.save();
    ctx.translate(r.x0 + w / 2, visY0 + visH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = d.spine.textColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const size = d.spine.fontSize * (visH / 1500);
    if (d.spine.title.trim()) {
      ctx.font = `bold ${size * 1.2}px Georgia, serif`;
      ctx.fillText(d.spine.title.trim(), -visH * 0.05, 0);
    }
    if (d.spine.author.trim()) {
      ctx.font = `${size * 0.7}px Georgia, serif`;
      ctx.fillText(d.spine.author.trim(), visH * 0.32, 0);
    }
    ctx.restore();
  });
}

function paintBack(d) {
  paintRegion('back', (ctx, r) => {
    const w = r.x1 - r.x0, h = r.y1 - r.y0;
    ctx.fillStyle = d.back.color;
    ctx.fillRect(r.x0, r.y0, w, h);

    // Safe zone is computed within the VISIBLE face area (visY0..y1) so the
    // blurb / barcode never land in the inner-cover region above visY0.
    const visY0 = r.visY0 != null ? r.visY0 : r.y0;
    const visH  = r.y1 - visY0;
    const safeX = w * 0.10, safeY = visH * 0.12;
    const sx0 = r.x0 + safeX, sy0 = visY0 + safeY;
    const sw  = w - safeX * 2, sh = visH - safeY * 2;
    const barcodeH = d.back.barcode ? sh * 0.18 : 0;
    const blurbH   = sh - barcodeH;

    ctx.fillStyle = d.back.textColor;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const size = d.back.fontSize * (Math.min(sw, blurbH) / 700);
    ctx.font = `${size}px Georgia, serif`;
    const lineH = size * 1.45;
    const lines = wrapText(ctx, d.back.blurb, sw);
    const maxLines = Math.floor(blurbH / lineH);
    let y = sy0;
    for (const ln of lines.slice(0, maxLines)) { ctx.fillText(ln, sx0, y); y += lineH; }

    if (d.back.barcode) {
      const bw = sw * 0.30, bh = barcodeH * 0.85;
      const bx = sx0 + sw - bw, by = sy0 + sh - bh;
      ctx.fillStyle = '#fff'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#000';
      for (let i = 0; i < 32; i++) {
        const stripeW = bw / 64;
        if (i % 3 !== 1) ctx.fillRect(bx + i * (bw/32), by + 4, stripeW * (i % 2 ? 1.5 : 1), bh - 18);
      }
      ctx.font = `${bh*0.22}px monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('9 780000 000000', bx + bw/2, by + bh - 2);
    }
  });
}

function paintPaperEdges(d) {
  paintRegion('paperEdges', (ctx, r) => {
    const w = r.x1 - r.x0, h = r.y1 - r.y0;
    ctx.fillStyle = d.paper.color;
    ctx.fillRect(r.x0, r.y0, w, h);
    if (d.paper.grain) {
      // faint horizontal page-edge striations
      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      for (let y = r.y0 + 2; y < r.y1 - 2; y += 3) {
        ctx.beginPath(); ctx.moveTo(r.x0, y); ctx.lineTo(r.x1, y); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  });
}

function paintBookContent(d) {
  // Inside-page text gets split across the upper and lower content rects
  // (left page / right page of an open spread).
  const fullText = (d.paper.content || '').trim();
  if (!fullText) {
    // still fill paper color so the page surface isn't black
    for (const k of ['contentUpper', 'contentLower']) {
      paintRegion(k, (ctx, r) => {
        ctx.fillStyle = d.paper.color;
        ctx.fillRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
      });
    }
    return;
  }

  // Pre-wrap the full text once so we can split lines across the two pages.
  const measureC = document.createElement('canvas').getContext('2d');
  const fs = d.paper.fontSize || 22;
  measureC.font = `${fs}px Georgia, serif`;
  const upperRect = REGIONS.contentUpper;
  const colW = (upperRect.x1 - upperRect.x0) - 80; // account for inner margins
  const allLines = wrapText(measureC, fullText, colW);
  const lineH = fs * 1.5;

  const drawHalf = (key, lines) => {
    paintRegion(key, (ctx, r) => {
      const w = r.x1 - r.x0, h = r.y1 - r.y0;
      ctx.fillStyle = d.paper.color;
      ctx.fillRect(r.x0, r.y0, w, h);
      if (d.paper.grain) {
        // very subtle grain — printed paper isn't pure white
        const img = ctx.getImageData(r.x0, r.y0, w, h);
        const data = img.data;
        for (let i = 0; i < data.length; i += 4) {
          const n = (Math.random() - 0.5) * 6;
          data[i]   += n; data[i+1] += n; data[i+2] += n;
        }
        ctx.putImageData(img, r.x0, r.y0);
      }
      ctx.fillStyle = 'rgba(40,30,20,0.92)';
      ctx.font = `${fs}px Georgia, serif`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      const margin = 40;
      let y = r.y0 + margin;
      for (const ln of lines) {
        if (y + lineH > r.y1 - margin) break;
        ctx.fillText(ln, r.x0 + margin, y);
        y += lineH;
      }
    });
  };

  const upperCapacity = Math.floor(((upperRect.y1 - upperRect.y0) - 80) / lineH);
  drawHalf('contentUpper', allLines.slice(0, upperCapacity));
  drawHalf('contentLower', allLines.slice(upperCapacity));
}

// ── Calibration overlay ─────────────────────────────────────────────────────
// Paints each REGIONS rect as a flat solid color matching the user's overlay
// legend, plus TL / TR / BL / BR letters at corners so per-region orientation
// flags can be verified by reading which letter ends up where on the rendered
// book. Activated by the "Show region overlay" checkbox.
function paintCalibrationOverlay() {
  // Pass 1: fill colors + orientation corner markers (drawn through the flip
  // transform so they reflect what the GPU actually renders on the 3D surface).
  for (const [key, r] of Object.entries(REGIONS)) {
    paintRegion(key, (ctx, _r) => {
      const w = r.x1 - r.x0, h = r.y1 - r.y0;
      ctx.fillStyle = r.color;
      ctx.fillRect(r.x0, r.y0, w, h);
      const visY0 = r.visY0 != null ? r.visY0 : r.y0;
      const visH  = r.y1 - visY0;
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.font = `bold ${Math.min(w, visH) * 0.1}px sans-serif`;
      ctx.textBaseline = 'top';
      ctx.textAlign = 'left';   ctx.fillText('TL', r.x0 + 10, visY0 + 6);
      ctx.textAlign = 'right';  ctx.fillText('TR', r.x1 - 10, visY0 + 6);
      ctx.textBaseline = 'bottom';
      ctx.textAlign = 'left';   ctx.fillText('BL', r.x0 + 10, r.y1 - 6);
      ctx.textAlign = 'right';  ctx.fillText('BR', r.x1 - 10, r.y1 - 6);
    });
  }
  // Pass 2: readable region names drawn directly on texCtx (no flip transform)
  // so they are always legible in the UV layout preview.
  for (const [key, r] of Object.entries(REGIONS)) {
    const w = r.x1 - r.x0, h = r.y1 - r.y0;
    const sz = Math.max(24, Math.min(w, h) * 0.1);
    texCtx.font = `bold ${sz}px sans-serif`;
    texCtx.textAlign = 'center';
    texCtx.textBaseline = 'middle';
    const cx = r.x0 + w / 2, cy = r.y0 + h / 2;
    texCtx.fillStyle = 'rgba(0,0,0,0.75)';
    texCtx.fillText(r.label, cx + 2, cy + 2);
    texCtx.fillStyle = 'white';
    texCtx.fillText(r.label, cx, cy);
  }
}

// ── Main compositor ─────────────────────────────────────────────────────────
function rebuildTexture() {
  if (!coverDesignerReady) return;
  const d = readDesign();
  texCtx.clearRect(0, 0, TEX_W, TEX_H);

  if (document.getElementById('cpShowZones').checked) {
    paintCalibrationOverlay();
  } else {
    // Inner cover liner (x=[0,1430], y=[500,1224]): fills the area visible
    // when the book is open. Use inner color, or sync to front cover color.
    const innerColor = (d.inner && !d.inner.sync) ? d.inner.color : d.front.color;
    texCtx.fillStyle = innerColor;
    texCtx.fillRect(0, 500, 1430, 724);
    paintPaperEdges(d);
    paintBookContent(d);
    paintBack(d);
    paintSpine(d);
    paintFront(d);
  }

  renderPreview();
  if (liveBookTexture) applyTextureToBook(true);
}

let liveBookTexture = false;
function applyTextureToBook(silent) {
  if (!bookMaterial || !texCanvas) return;
  if (bookMaterial.map && bookMaterial.map._isCustomCanvas) {
    bookMaterial.map.needsUpdate = true;
  } else {
    if (bookMaterial.map) bookMaterial.map.dispose();
    const newTex = new THREE.CanvasTexture(texCanvas);
    newTex.colorSpace = THREE.SRGBColorSpace;
    newTex.flipY = false; // glTF default
    // Match original sampler
    newTex.wrapS = THREE.RepeatWrapping;
    newTex.wrapT = THREE.RepeatWrapping;
    newTex._isCustomCanvas = true;
    bookMaterial.map = newTex;
    bookMaterial.needsUpdate = true;
  }
  liveBookTexture = true;
}

// ── Preview canvas ──────────────────────────────────────────────────────────
function renderPreview() {
  const preview = document.getElementById('cpPreview');
  if (!preview || !texCanvas) return;
  const pctx = preview.getContext('2d');
  pctx.fillStyle = '#1a1a22';
  pctx.fillRect(0, 0, preview.width, preview.height);
  pctx.drawImage(texCanvas, 0, 0, preview.width, preview.height);

  // Outline every REGIONS rect on the preview so the operator can sanity-check
  // the addressable surfaces (also drawn when the calibration overlay is off).
  const sx = preview.width / TEX_W, sy = preview.height / TEX_H;
  pctx.lineWidth = 1.5;
  for (const r of Object.values(REGIONS)) {
    pctx.strokeStyle = r.color;
    pctx.strokeRect(r.x0*sx, r.y0*sy, (r.x1-r.x0)*sx, (r.y1-r.y0)*sy);
    pctx.fillStyle = r.color;
    pctx.font = 'bold 10px sans-serif';
    pctx.fillText(r.label, r.x0*sx + 3, r.y0*sy + 11);
  }
}

// ── Designer init (lazy on first open) ─────────────────────────────────────
async function initDesigner() {
  if (coverDesignerReady) return;
  if (!bookMesh) { console.warn('[CoverDesigner] cover mesh not yet loaded'); return; }
  texCanvas = document.createElement('canvas');
  texCanvas.width = TEX_W; texCanvas.height = TEX_H;
  texCtx = texCanvas.getContext('2d');
  coverDesignerReady = true;
  loadDesignList();
  syncHexLabels();
  syncRangeLabels();
  rebuildTexture();
}

// ── UI wiring ──────────────────────────────────────────────────────────────
document.getElementById('coverDesignerBtn').addEventListener('click', async () => {
  document.getElementById('coverPanel').style.display = 'block';
  await initDesigner();
});
document.getElementById('cpClose').addEventListener('click', () => {
  document.getElementById('coverPanel').style.display = 'none';
});

// Tabs
// ── Draggable UV region boundaries ──────────────────────────────────────────
// Allows the user to drag boundary lines in the UV layout preview to
// recalibrate region coordinates without editing code.
(function () {
  const preview = document.getElementById('cpPreview');
  const SNAP = 8; // hit-test radius in display pixels

  // Each draggable edge: axis, which coord getter, and which fields to update.
  function edges() {
    return [
      { axis:'x', get:()=>REGIONS.front.x1,        set:(v)=>{ REGIONS.front.x1=v; REGIONS.spine.x0=v; } },
      { axis:'x', get:()=>REGIONS.spine.x1,         set:(v)=>{ REGIONS.spine.x1=v; REGIONS.back.x0=v; } },
      { axis:'x', get:()=>REGIONS.back.x1,          set:(v)=>{ REGIONS.back.x1=v; REGIONS.contentUpper.x0=v; REGIONS.contentLower.x0=v; } },
      { axis:'y', get:()=>REGIONS.paperEdges.y1,    set:(v)=>{ REGIONS.paperEdges.y1=v; REGIONS.contentUpper.y0=v; } },
      { axis:'y', get:()=>REGIONS.contentUpper.y1,  set:(v)=>{ REGIONS.contentUpper.y1=v; REGIONS.contentLower.y0=v; } },
      { axis:'y', get:()=>REGIONS.front.y0,         set:(v)=>{ ['front','spine','back'].forEach(k=>{ REGIONS[k].y0=v; REGIONS[k].visY0=v; }); } },
    ];
  }

  function scale() { return 2048 / preview.getBoundingClientRect().width; }
  function toTex(px) { return Math.round(px * scale()); }
  function toDisplay(tex, axis) {
    const r = preview.getBoundingClientRect();
    return tex / 2048 * (axis === 'x' ? r.width : r.height);
  }

  let dragging = null;

  preview.addEventListener('mousemove', (e) => {
    if (dragging) {
      const rect = preview.getBoundingClientRect();
      const pos = dragging.axis === 'x'
        ? toTex(e.clientX - rect.left)
        : toTex(e.clientY - rect.top);
      dragging.set(Math.max(0, Math.min(2048, pos)));
      rebuildTexture(); applyTextureToBook(true);
      return;
    }
    const rect = preview.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    let hit = false;
    for (const edge of edges()) {
      const displayPos = toDisplay(edge.get(), edge.axis);
      const dist = edge.axis === 'x' ? Math.abs(mx - displayPos) : Math.abs(my - displayPos);
      if (dist < SNAP) { hit = true; preview.style.cursor = edge.axis === 'x' ? 'col-resize' : 'row-resize'; break; }
    }
    if (!hit) preview.style.cursor = 'default';
  });

  preview.addEventListener('mousedown', (e) => {
    const rect = preview.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    for (const edge of edges()) {
      const displayPos = toDisplay(edge.get(), edge.axis);
      const dist = edge.axis === 'x' ? Math.abs(mx - displayPos) : Math.abs(my - displayPos);
      if (dist < SNAP) { dragging = edge; e.preventDefault(); return; }
    }
  });

  window.addEventListener('mouseup', () => { dragging = null; });
  window.addEventListener('mouseleave', () => { dragging = null; });
})();

document.querySelectorAll('.cp-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const target = tab.dataset.tab;
    document.querySelectorAll('.cp-tab').forEach(t => t.classList.toggle('active', t === tab));
    document.querySelectorAll('.cp-page').forEach(p => p.classList.toggle('active', p.dataset.page === target));
  });
});

// Wire all inputs to live update
const LIVE_IDS = [
  'cpFrontColor','cpFrontTextColor','cpFrontTitle','cpFrontSubtitle','cpFrontAuthor',
  'cpFrontFontSize','cpFrontFont','cpFrontFrame',
  'cpSpineColor','cpSpineTextColor','cpSpineTitle','cpSpineAuthor','cpSpineFontSize','cpSpineBands',
  'cpBackColor','cpBackTextColor','cpBackBlurb','cpBackFontSize','cpBackBarcode',
  'cpPaperColor','cpPaperGrain','cpPaperContent','cpPaperFontSize',
];
LIVE_IDS.forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => { syncHexLabels(); syncRangeLabels(); rebuildTexture(); });
  el.addEventListener('change', () => { syncHexLabels(); syncRangeLabels(); rebuildTexture(); });
});

// Show-zones debug toggle
document.getElementById('cpShowZones').addEventListener('change', () => { rebuildTexture(); applyTextureToBook(true); });
document.getElementById('cpInnerColor').addEventListener('input', (e) => {
  document.getElementById('cpInnerColorHex').textContent = e.target.value;
  rebuildTexture(); applyTextureToBook(true);
});
document.getElementById('cpInnerSync').addEventListener('change', () => { rebuildTexture(); applyTextureToBook(true); });

// Front cover image upload
document.getElementById('cpFrontImage').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  document.getElementById('cpFrontImageName').textContent = file ? file.name : '';
  if (!file) { frontImageBitmap = null; frontImageData = null; rebuildTexture(); return; }
  // Store as base64 for design persistence
  frontImageData = await new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (ev) => resolve(ev.target.result);
    reader.readAsDataURL(file);
  });
  frontImageBitmap = await createImageBitmap(file);
  rebuildTexture();
});

// Apply button — push to 3D
document.getElementById('cpApply').addEventListener('click', () => {
  if (!coverDesignerReady) return;
  applyTextureToBook();
});

// Download PNG (final unwrapped texture as the GPU sees it)
document.getElementById('cpDownload').addEventListener('click', () => {
  if (!texCanvas) return;
  const a = document.createElement('a');
  a.href = texCanvas.toDataURL('image/png');
  a.download = 'book-cover-design.png';
  a.click();
});

// Download JSON — the portable design config that biblio will consume.
// Image data isn't included (designs reference imported assets by URL/blob).
document.getElementById('cpDownloadJSON').addEventListener('click', () => {
  const d = readDesign();
  const payload = {
    schema: 'biblio-book-design/v1',
    exportedAt: new Date().toISOString(),
    design: d,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${(d.front.title || 'untitled').replace(/[^a-z0-9-]+/gi, '_').toLowerCase()}.book.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

// ── Persistence ─────────────────────────────────────────────────────────────
const DESIGN_KEY = 'bookCoverDesigns';
function loadDesignList() {
  const sel = document.getElementById('cpDesignSelect');
  sel.innerHTML = '<option value="">— Load design —</option>';
  const list = JSON.parse(localStorage.getItem(DESIGN_KEY) || '[]');
  list.forEach((d, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = d.name;
    sel.appendChild(o);
  });
}
document.getElementById('cpSaveBtn').addEventListener('click', () => {
  const name = prompt('Design name:');
  if (!name || !name.trim()) return;
  const list = JSON.parse(localStorage.getItem(DESIGN_KEY) || '[]');
  list.push({ name: name.trim(), design: readDesign() });
  localStorage.setItem(DESIGN_KEY, JSON.stringify(list));
  loadDesignList();
});
document.getElementById('cpDesignSelect').addEventListener('change', (e) => {
  const idx = e.target.value; if (idx === '') return;
  const list = JSON.parse(localStorage.getItem(DESIGN_KEY) || '[]');
  if (!list[idx]) return;
  writeDesign(list[idx].design);
  rebuildTexture();
  e.target.value = '';
});
document.getElementById('cpDelBtn').addEventListener('click', () => {
  const sel = document.getElementById('cpDesignSelect');
  const idx = sel.value; if (idx === '') { alert('Pick a design to delete first.'); return; }
  const list = JSON.parse(localStorage.getItem(DESIGN_KEY) || '[]');
  list.splice(idx, 1);
  localStorage.setItem(DESIGN_KEY, JSON.stringify(list));
  loadDesignList();
});
